name: Skills and runnable examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/validate_catalog.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/run_demo.py --out local-runs/demo
      - run: python skills/abaqus-parametric-workflow/scripts/prepare_sweep.py skills/abaqus-parametric-workflow/assets/sweep.json --out local-runs/sweep --max-cases 2
      - run: python skills/abaqus-parametric-workflow/scripts/run_sweep.py local-runs/sweep/manifest.json
